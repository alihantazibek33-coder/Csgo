name: CS2 Style Menu Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract ZIP project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

      - name: Find project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Minecraft Mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Prepare JAR
        run: |
          mkdir -p output
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -name "*.jar" \
            ! -name "*-sources.jar" -exec cp {} output/ \;

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: JAR not generated!"
            exit 1
          fi

      - name: Upload finished Mod
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Style-Menu-1.21.11
          path: output/*.jar
          if-no-files-found: error
